# Setting Ctrl-a as prefix 
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Make tmux more responsive
set -s escape-time 1

# Increase history limit to 10000
set -g history-limit 10000

# Reload the config file 
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Send Ctrl-a to other applicatoins
bind C-a send-prefix

bind | split-window -h
bind - split-window -v

# Remapping for better windows selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 6

# Setting active windows: 
#setw -g window-status-fg black
#setw -g window-status-bg default
#setw -g window-status-attr dim

#setw -g window-status-current fg=white, bg=red, attr=bright
#setw -g window-status-current-bg red
#setw -g window-status-current-attr bright

# Set pane active border
#set -g pane-active-border-style
set -g default-shell /usr/local/bin/fish

# Enable vi mode 
setw -g mode-keys vi

# based on https://stackoverflow.com/a/40902312/1046584
run-shell "tmux setenv -g TMUX_VERSION $(tmux -V | cut -c 6-)"

### In version 2.1 "mouse" replaced the previous 4 mouse options
if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.1" | bc)" = 1 ]' \
  "set -g mouse on"

## UTF8 is autodetected in 2.2 onwards, but errors if explicitly set
if-shell -b '[ "$(echo "$TMUX_VERSION < 2.2" | bc)" = 1 ]' \
  "set -g utf8 on; set -g status-utf8 on; set -g mouse-utf8 on"

#Moving between sesssions
bind -r ( switch-client -p
bind -r ) switch-client -n

#Move panes
# C-a } / C-a {

# Make Ctrl+arrows work
set-window-option -g xterm-keys on

# macOS only; Selected text is copied on the clipboard:
# from: https://unix.stackexchange.com/questions/318281/how-to-copy-and-paste-with-a-mouse-with-tmux/318285#318285
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clibboard
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
