# Setting Ctrl-a as prefix 
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Make tmux more responsive
set -s escape-time 1
# Windows start at 1
set -g base-index 1
setw -g pane-base-index 1

# Reload the config file 
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Send Ctrl-a to other applicatoins
bind C-a send-prefix

bind | split-window -h
bind - split-window -v

# Remapping for better windows selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 6

# Set up mouse-mode
setw -g mode-mouse off

# Setting active windows: 
setw -g window-status-fg black
setw -g window-status-bg default
setw -g window-status-attr dim

setw -g window-status-current-fg white
setw -g window-status-current-bg red
setw -g window-status-current-attr bright

# Set pane active border
set -g pane-active-border-bg red

set -g status-utf8 on

# Enable vi mode 
setw -g mode-keys vi

# Make it use vim keys for compy and paste mode
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -t vi-copy 'v' begin-selection
bind -t vi-copy 'y' copy-selection

#Moving between sesssions
bind -r ( switch-client -p
bind -r ) switch-client -n

#Move panes
# C-a } / C-a {
#

# Make Ctrl+arrow keys work 
set-window-option -g xterm-keys on
